name: Manual APK Release Build

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Artifact name, example: v1.0.6"
        required: false
        default: "v1.0.6"
        type: string

permissions:
  contents: read
  actions: read

env:
  APP_NAME: Battery-Rock

jobs:
  build-apk:
    name: Build release APK manually
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare local Android config
        shell: bash
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Prepare compile-only API jar
        shell: bash
        run: |
          mkdir -p app/libs
          curl -L --retry 3 --retry-delay 2 --fail \
            -o app/libs/api-82.jar \
            "https://github.com/rovo89/XposedBridge/releases/download/82/api-82.jar"

      - name: Build release APK
        shell: bash
        run: |
          gradle --no-daemon --console=plain :app:assembleRelease

      - name: Prepare APK artifact
        shell: bash
        run: |
          mkdir -p release-artifacts
          find app/build/outputs/apk/release -name "*.apk" -print -exec cp {} release-artifacts/ \;

          if ! compgen -G "release-artifacts/*.apk" > /dev/null; then
            echo "::error::No release APK found."
            exit 1
          fi

          cd release-artifacts
          for apk in *.apk; do
            mv "$apk" "${APP_NAME}-${{ github.event.inputs.release_name }}.apk"
          done
          sha256sum *.apk > SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ github.event.inputs.release_name }}
          path: release-artifacts/*
          if-no-files-found: error

name: flutter_module
description: "A new Flutter module project."

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  battery: ^2.0.3
  flutter_background_geolocation: ^5.5.0
  battery_plus: ^7.1.1
  tracelet: ^3.2.17
  native_geofence: ^1.3.1
  disable_battery_optimization: ^1.1.2
  optimize_battery: ^0.0.4
  cupertino_battery_indicator: ^1.2.1
  battery_info: ^1.1.1
  battery_optimization_helper: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  module:
    androidX: true
    androidPackage: com.example.flutter_module
    iosBundleIdentifier: com.example.flutterModule
